<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="../../../css/style.css" rel="stylesheet">
  <script src="../../../js/interfaz.js" defer></script>
</head>     
<body>
    <div class="card">
    <h1 class="titulo"><strong>Búsqueda de Referencias</strong></h1>

    <div class="form-row">
        <div class="form-group">
            <label>Nombre del candidato</label>
            <input type="text" id="valor-busqueda-candidato" placeholder="Ingrese nombre">
        </div>

        <div class="form-group">
            <label>Cargo</label>
            <input type="text" id="valor-busqueda-cargo" placeholder="Ingrese cargo">
        </div>
    </div>
    

    <button class="btn-save" onclick="buscarReferencia()">Buscar</button>

    <div id="contenido-referencias"></div>

    <div id="contenedor-referencias-detalle"></div>
</div>
</div>
</body>
